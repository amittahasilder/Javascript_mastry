<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form id="form">
  <input type="text" id="username" placeholder="Username">
  <small id="userError"></small><br><br>

  <input type="email" id="email" placeholder="Email">
  <small id="emailError"></small><br><br>

  <input type="password" id="password" placeholder="Password">
  <small id="passError"></small><br><br>

  <button type="submit">Submit</button>
</form>

<script>
    const form = document.querySelector("#form");
const username = document.querySelector("#username");
const email = document.querySelector("#email");
const password = document.querySelector("#password");

form.addEventListener("submit", (e) => {
  e.preventDefault(); // page reload বন্ধ

  if (username.value === "") {
    document.querySelector("#userError").textContent = "Username required";
  } else {
    document.querySelector("#userError").textContent = "";
  }

  if (email.value === "") {
    document.querySelector("#emailError").textContent = "Email required";
  } else {
    document.querySelector("#emailError").textContent = "";
  }

  if (password.value.length < 6) {
    document.querySelector("#passError").textContent =
      "Password must be at least 6 characters";
  } else {
    document.querySelector("#passError").textContent = "";
  }
});

</script>
</body>
</html>
